name: mobile_app
description: Rice Leaf Disease Detection & Severity App.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Network & API
  dio: ^5.4.0
  
  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.3
  
  # Local Storage
  sqflite: ^2.4.3
  path_provider: ^2.1.2
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^11.0.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/riceai-app-icon-concept-v1.png"
  adaptive_icon_background: "#173D2B"
  adaptive_icon_foreground: "assets/branding/riceai-app-icon-concept-v1.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/riceai-app-icon-concept-v1.png
